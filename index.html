<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杨楚楚 - 视觉设计师 | Picontier 像素小镇作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. PICONTIER TOWN COLOR PALETTE & SYSTEM
       ========================================== */
    :root {
      --town-sky: #70c0ff;
      --town-grass: #58b038;
      --town-grass-dark: #388020;
      --roof-red: #d84830;
      --roof-blue: #3868c0;
      --roof-yellow: #e8a020;
      --wall-cream: #f8f0d8;
      --wood-dark: #583018;
      --wood-light: #a06030;
      
      --card-bg: rgba(26, 32, 44, 0.94);
      --card-border: #f8a020;
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      
      --font-pixel: 'Press Start 2P', cursive, monospace;
      --font-retro: 'Silkscreen', sans-serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      background: var(--town-sky);
      font-family: var(--font-ui);
      color: var(--text-main);
    }

    /* 复古 CRT 滤镜 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
      background-size: 100% 4px;
      z-index: 998;
      pointer-events: none;
    }

    /* ==========================================
       2. HUD TOP NAVBAR & CONTROLS
       ========================================== */
    .hud-header {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 60px;
      background: #181c24;
      border-bottom: 4px solid #383848;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .brand-logo {
      display: flex; align-items: center; gap: 10px;
      color: var(--card-border);
      font-family: var(--font-pixel); font-size: 0.75rem;
      text-shadow: 2px 2px #583018; cursor: pointer;
    }

    .controls-hint {
      font-family: var(--font-retro); font-size: 0.8rem;
      background: #282c38; padding: 6px 14px; border: 2px solid #484c58;
      border-radius: 4px; color: #70c0ff;
    }

    .sound-group { display: flex; gap: 8px; }
    .sound-toggle {
      background: #2a2038; border: 3px solid #7848a0; color: #f0c0ff;
      padding: 6px 12px; font-family: var(--font-retro); font-size: 0.8rem;
      cursor: pointer; box-shadow: 0 4px 0 #000;
    }
    .sound-toggle:hover { background: #482c60; border-color: #d080ff; }

    /* ==========================================
       3. PICONTIER MAP & HOUSES
       ========================================== */
    .town-viewport {
      position: relative;
      min-width: 3800px;
      height: 100vh;
      background: linear-gradient(to bottom, #70c0ff 0%, #a0d8ff 60%, var(--town-grass) 60%, var(--town-grass-dark) 100%);
      overflow: hidden;
    }

    /* 装饰：树木与小花 */
    .pixel-tree {
      position: absolute; bottom: 120px; width: 64px; height: 96px;
      background: #287818; border: 4px solid #000; border-radius: 32px 32px 8px 8px;
      box-shadow: inset -8px -8px 0 #185010;
    }
    .pixel-tree::after {
      content: ""; position: absolute; bottom: -24px; left: 24px;
      width: 16px; height: 28px; background: var(--wood-dark); border: 3px solid #000;
    }

    /* 房屋建筑（Picontier 房屋系统） */
    .house-module {
      position: absolute;
      bottom: 120px;
      width: 320px;
      background: var(--wall-cream);
      border: 4px solid #000;
      box-shadow: 8px 12px 0 rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .house-module:hover { transform: translateY(-6px); }

    .house-roof {
      position: absolute; top: -70px; width: 350px; height: 70px;
      background: var(--roof-red); border: 4px solid #000;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }

    .house-sign {
      position: absolute; top: -105px;
      background: var(--wood-light); border: 3px solid #000;
      color: #fff; font-family: var(--font-pixel); font-size: 0.65rem;
      padding: 6px 12px; box-shadow: 0 4px 0 #000; text-align: center;
    }

    .house-door {
      position: absolute; bottom: 0; width: 60px; height: 90px;
      background: var(--wood-dark); border: 4px solid #000;
      border-radius: 8px 8px 0 0;
      box-shadow: inset -4px 0 0 var(--wood-light);
    }
    .house-door::after {
      content: ""; position: absolute; top: 42px; right: 8px;
      width: 8px; height: 8px; background: #f8a020; border-radius: 50%;
    }

    .house-window {
      width: 50px; height: 50px; background: #80e0ff;
      border: 4px solid #000; margin-top: 30px;
      box-shadow: inset 4px 4px 0 #fff;
    }

    .house-title-label {
      font-family: var(--font-retro); font-size: 1.1rem;
      color: var(--wood-dark); font-weight: bold; margin-top: 20px;
    }

    /* 地面与小路 */
    .ground-path {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
      background: #a07040; border-top: 8px solid var(--town-grass-dark);
      background-image: radial-gradient(#784820 15%, transparent 16%);
      background-size: 24px 24px;
    }

    /* ==========================================
       4. CHARACTER & POPUP MODAL
       ========================================== */
    #hero-character-container {
      position: absolute; bottom: 120px; left: 150px;
      width: 64px; height: 84px; z-index: 500;
      pointer-events: none; transform: translateX(-50%);
      transition: bottom 0.15s ease;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--card-bg); border: 4px solid #000;
      outline: 4px solid var(--card-border); border-radius: 8px;
      padding: 32px; max-width: 720px; width: 90%;
      box-shadow: 0 12px 24px rgba(0,0,0,0.8);
      max-height: 85vh; overflow-y: auto; position: relative;
    }

    .close-btn {
      position: absolute; top: 16px; right: 16px;
      background: #e52521; color: #fff; border: 3px solid #000;
      font-family: var(--font-pixel); padding: 6px 10px; cursor: pointer;
    }

    .pixel-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; background: #e52521; color: #fff;
      font-family: var(--font-retro); font-weight: 700; font-size: 0.9rem;
      padding: 10px 18px; border: 3px solid #000; border-radius: 4px;
      cursor: pointer; box-shadow: 0 4px 0 #000; margin: 6px 4px;
      text-decoration: none;
    }
    .pixel-btn:hover { background: #ff3b30; transform: translateY(-2px); }
    .pixel-btn.secondary { background: #0058d8; }
  </style>
</head>
<body>

  <!-- HUD 顶栏 -->
  <header class="hud-header">
    <div class="brand-logo" onclick="walkToX(150)">
      <span>🏡 YANG CHUCHU PICONTIER TOWN</span>
    </div>
    <div class="controls-hint">
      🎮 控制：键盘 [A / D / 👈 👉] 行走，[Space / W] 跳跃 | 点击地面/房子可直接走去
    </div>
    <div class="sound-group">
      <button class="sound-toggle" id="bgm-btn">🎵 BGM: OFF</button>

    </div>
  </header>

  <!-- 地图主场景 -->
  <div class="town-viewport" id="town-viewport">
    
    <!-- 装饰树木 -->
    <div class="pixel-tree" style="left: 80px;"></div>
    <div class="pixel-tree" style="left: 650px;"></div>
    <div class="pixel-tree" style="left: 130px;"></div>
    <div class="pixel-tree" style="left: 2000px;"></div>
    <div class="pixel-tree" style="left: 2700px;"></div>

    <!-- 1. HOME 房子 -->
    <div class="house-module" style="left: 250px; height: 210px;" onclick="interactWithHouse('home', 410)">
      <div class="house-roof"></div>
      <div class="house-sign">WORLD 1-1<br>HOME</div>

    <!-- 2. ABOUT 房子 -->
    <div class="house-module" style="left: 850px; height: 220px;" onclick="interactWithHouse('about', 1010)">
      <div class="house-roof" style="background: var(--roof-blue);"></div>

    <!-- 3. SKILLS 房子 -->
    <div class="house-module" style="left: 1500px; height: 230px;" onclick="interactWithHouse('skills', 1660)">

    <!-- 4. PROJECTS 房子 -->
    <div class="house-module" style="left: 2150px; height: 240px;" onclick="interactWithHouse('projects', 2310)">

    <!-- 5. EXPERIENCE 城堡 -->
    <div class="house-module" style="left: 2800px; height: 260px; background: #a0a8b8;" onclick="interactWithHouse('experience', 2960)">
      <div class="house-roof" style="background: #484860; clip-path: none; top: -40px; height: 40px; width: 330px;"></div>
      <div class="house-sign">WORLD 1-5<br>EXPERIENCE</div>
      <div class="house-window" style="background: #f8e070;"></div>

    </div>

    <!-- 6. CONTACT 终点旗帜小屋 -->
    <div class="house-module" style="left: 3400px; height: 210px;" onclick="interactWithHouse('contact', 3560)">
      <div class="house-roof" style="background: #803090;"></div>
      <div class="house-sign">FINAL STAGE<br>CONTACT</div>
      <div class="house-window"></div>
      <div class="house-title-label">联系驿站</div>
      <div class="house-door"></div>
    </div>

    <!-- 人物 Vector SVG -->
    <div id="hero-character-container">
      <svg viewBox="0 0 76 100" style="width:100%; height:100%;">
        <g id="char-root">
          <path d="M 18,16 L 58,16 L 64,28 L 12,28 Z" fill="#e52521" stroke="#000" stroke-width="2"/>
          <path d="M 8,28 L 68,28 L 68,34 L 8,34 Z" fill="#b81810" stroke="#000" stroke-width="2"/>
          <rect x="14" y="34" width="48" height="28" rx="4" fill="#ffcca0" stroke="#000" stroke-width="2"/>
          <ellipse cx="28" cy="44" rx="4" ry="7" fill="#000"/><circle cx="27" cy="42" r="2" fill="#fff"/>
          <ellipse cx="48" cy="44" rx="4" ry="7" fill="#000"/><circle cx="47" cy="42" r="2" fill="#fff"/>
          <path d="M 20,52 Q 38,62 56,52 Q 38,56 20,52 Z" fill="#3a1d00" stroke="#000" stroke-width="2"/>
          <rect x="22" y="62" width="32" height="16" fill="#e52521" stroke="#000" stroke-width="2"/>
          <path d="M 24,66 L 52,66 L 54,82 L 22,82 Z" fill="#0038d8" stroke="#000" stroke-width="2"/>
          <g id="leg-l"><path d="M 16,90 L 34,90 L 34,96 L 16,96 Z" fill="#682800" stroke="#000" stroke-width="2"/></g>

    <div class="ground-path" id="ground-path"></div>

  <!-- 房子详情弹窗（Modal） -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">X</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ==========================================
       5. GAME ENGINE & LONG BGM SYSTEM
       ========================================== -->
  <script>
    /* 1. 音效与 Picontier 风长乐曲合成器 */
    let audioCtx = null;
    let sfxOn = false;
    let bgmOn = false;
    let bgmTimer = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) audioCtx = new AudioCtxClass();
      }
    }

    function playSfx(type) {
      if (!sfxOn || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.15);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
        osc.start(t); osc.stop(t + 0.15);
      } else if (type === 'open') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.setValueAtTime(600, t + 0.08);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
      }
    }

    /* 包含 A/B 段舒缓悠扬的 8-Bit Picontier 治愈小镇长乐曲 */
    const longTownMelody = [
      // Section A
      {f: 523.25, d: 0.25}, {f: 659.25, d: 0.25}, {f: 783.99, d: 0.25}, {f: 1046.50, d: 0.5},
      {f: 880.00, d: 0.25}, {f: 783.99, d: 0.5}, {f: 659.25, d: 0.5},
      {f: 587.33, d: 0.25}, {f: 659.25, d: 0.25}, {f: 698.46, d: 0.5}, {f: 659.25, d: 0.25}, {f: 587.33, d: 0.5},
      {f: 523.25, d: 0.75}, {f: 0, d: 0.25},
      
      // Section A'
      {f: 523.25, d: 0.25}, {f: 659.25, d: 0.25}, {f: 783.99, d: 0.25}, {f: 1046.50, d: 0.5},
      {f: 1174.66, d: 0.25}, {f: 1046.50, d: 0.5}, {f: 880.00, d: 0.5},
      {f: 783.99, d: 0.25}, {f: 880.00, d: 0.25}, {f: 783.99, d: 0.25}, {f: 659.25, d: 0.25}, {f: 587.33, d: 0.5},
      {f: 523.25, d: 0.75}, {f: 0, d: 0.25},

      // Section B (副歌升调)
      {f: 880.00, d: 0.35}, {f: 987.77, d: 0.2}, {f: 1046.50, d: 0.35}, {f: 880.00, d: 0.35},
      {f: 783.99, d: 0.35}, {f: 659.25, d: 0.35}, {f: 523.25, d: 0.5},
      {f: 698.46, d: 0.35}, {f: 783.99, d: 0.35}, {f: 880.00, d: 0.35}, {f: 698.46, d: 0.35},
      {f: 659.25, d: 0.75}, {f: 0, d: 0.25}
    ];

    let noteIdx = 0;
    function playNextTownNote() {
      if (!bgmOn || !audioCtx) return;
      const note = longTownMelody[noteIdx];
      if (note.f > 0) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle'; // 选用温暖柔和的三角波
        osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.d);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + note.d);
      }
      noteIdx = (noteIdx + 1) % longTownMelody.length;
      bgmTimer = setTimeout(playNextTownNote, note.d * 1000);
    }

    document.getElementById('bgm-btn').addEventListener('click', () => {
      initAudio();
      bgmOn = !bgmOn;
      document.getElementById('bgm-btn').textContent = bgmOn ? '🎵 BGM: ON' : '🎵 BGM: OFF';
      if (bgmOn) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playNextTownNote();
      } else {
        clearTimeout(bgmTimer);
      }
    });

    document.getElementById('sound-btn').addEventListener('click', () => {
      initAudio();
      sfxOn = !sfxOn;
      document.getElementById('sound-btn').textContent = sfxOn ? '🔊 SFX: ON' : '🔇 SFX: OFF';
    });

    /* 2. 人物物理与小镇行走引擎 */
    const hero = document.getElementById('hero-character-container');
    let heroX = 150;
    let targetX = 150;
    let heroPosY = 0; // 跳跃高度
    let velocityY = 0;
    let isJumping = false;
    let facingRight = true;
    let keys = {};

    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    document.getElementById('ground-path').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickXOnMap = e.clientX - rect.left;
      targetX = clickXOnMap;
    });

    function walkToX(x) { targetX = x; }

    function updatePhysics() {
      // 键盘优先
      if (keys['a'] || keys['arrowleft']) {
        targetX = heroX - 6;
        facingRight = false;
      } else if (keys['d'] || keys['arrowright']) {
        targetX = heroX + 6;
        facingRight = true;
      }

      if ((keys['w'] || keys[' '] || keys['arrowup']) && !isJumping) {
        isJumping = true;
        velocityY = 12;
        playSfx('jump');
      }

      // 跳跃物理
      if (isJumping) {
        heroPosY += velocityY;
        velocityY -= 0.8;
        if (heroPosY <= 0) {
          heroPosY = 0;
          isJumping = false;
        }
      }

      // 平滑步行
      const dx = targetX - heroX;
      if (Math.abs(dx) > 2) {
        facingRight = dx > 0;
        heroX += Math.sign(dx) * Math.min(Math.abs(dx), 5);
      }

      // 保持坐标范围
      heroX = Math.max(50, Math.min(3700, heroX));

      // 更新 DOM
      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${120 + heroPosY}px`;
      hero.style.transform = `translateX(-50%) scaleX(${facingRight ? 1 : -1})`;

      // 镜头平滑跟随小人
      const screenWidth = window.innerWidth;
      const scrollLeft = heroX - screenWidth / 2;
      window.scrollTo({ left: Math.max(0, scrollLeft), behavior: 'auto' });

      requestAnimationFrame(updatePhysics);
    }
    requestAnimationFrame(updatePhysics);

    /* 3. 房子交互与简历 Modal 详情[cite: 3] */
    const modalData = {
      home: `
        <h2 style="font-family: var(--font-retro); color: var(--card-border); margin-bottom: 10px;">🏡 杨楚楚 | 视觉设计师</h2>
        <p style="color: var(--text-muted); margin-bottom: 16px;">3.5年跨境电商视觉设计经验 / AIGC工具提效 / 离职随时到岗[cite: 3]</p>
        <p style="line-height: 1.6; color: #d0d8e8;">熟练掌握国外电商平台风格（Amazon、eBay、Walmart、美客多、速卖通、独立站等），能独立完成产品全链路视觉设计与爆款打造。[cite: 3]</p>
      `,
      about: `
        <h2 style="font-family: var(--font-retro); color: var(--card-border); margin-bottom: 10px;">🍄 个人档案与综合素质[cite: 3]</h2>
        <p style="line-height: 1.6; margin-bottom: 12px; color: #d0d8e8;"><b>【学历背景】</b> 闽南理工学院 - 全日制本科 (视觉传达设计专业)[cite: 3]</p>
        <p style="line-height: 1.6; color: #d0d8e8;"><b>【核心优势】</b> 拥有黑五、Prime Day 等大型电商活动设计经验，掌握跨境电商视觉创意方法论[cite: 3]。精通 PS、AI、Procreate、Keyshot 等设计软件，擅长运用 AIGC 工具辅助项目设计，显著提升视觉吸引力与效率[cite: 3]。</p>
      `,
      skills: `
        <h2 style="font-family: var(--font-retro); color: var(--card-border); margin-bottom: 10px;">⭐ 技能装备库[cite: 3]</h2>
        <ul style="line-height: 1.8; color: #d0d8e8; margin-left: 20px;">
