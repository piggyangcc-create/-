<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picontier 像素小镇作品集</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       1. PICONTIER PALETTE & GLOBAL STYLES
       ========================================== */
    :root {
      --sky-top: #88c8f8;
      --sky-bottom: #c0e8ff;
      --grass-main: #58b038;
      --grass-dark: #388020;
      --path-color: #d8a060;
      --wood-dark: #402818;
      --wood-light: #885028;
      --gold-accent: #f8c030;
      
      --ui-bg: rgba(20, 24, 38, 0.95);
      --ui-border: #f8c030;
      --font-pixel: 'Press Start 2P', cursive, monospace;
      --font-retro: 'Silkscreen', sans-serif;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden;
      background: var(--sky-top); font-family: var(--font-main); color: #fff;
      image-rendering: pixelated;
    }

    /* 复古 CRT 电视扫描线 */
    body::after {
      content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.08) 50%);
      background-size: 100% 4px; z-index: 998; pointer-events: none;
    }

    /* ==========================================
       2. HUD TOP NAVBAR
       ========================================== */
    .hud-header {
      position: fixed; top: 0; left: 0; width: 100%; height: 56px;
      background: #181424; border-bottom: 4px solid var(--gold-accent);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 1000; box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    }

    .brand-title {
      font-family: var(--font-pixel); font-size: 0.8rem; color: var(--gold-accent);
      text-shadow: 2px 2px #000; display: flex; align-items: center; gap: 8px;
    }

    .controls-badge {
      font-family: var(--font-retro); font-size: 0.85rem; background: #282038;
      border: 2px solid #584870; color: #a0e0ff; padding: 6px 14px; border-radius: 4px;
    }

    .sound-btn {
      background: #382848; border: 2px solid var(--gold-accent); color: #f8e080;
      font-family: var(--font-retro); font-size: 0.8rem; padding: 6px 12px;
      cursor: pointer; box-shadow: 0 3px 0 #000; transition: transform 0.1s;
    }
    .sound-btn:active { transform: translateY(3px); box-shadow: none; }

    /* ==========================================
       3. MAP SCENERY & ANIMATED ELEMENTS
       ========================================== */
    .town-viewport {
      position: relative; min-width: 3800px; height: 100vh;
      background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 55%, var(--grass-main) 55%, var(--grass-dark) 100%);
      overflow: hidden;
    }

    /* 飘动的像素云朵 */
    .pixel-cloud {
      position: absolute; background: #fff; border-radius: 8px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1); opacity: 0.9;
      animation: floatCloud linear infinite;
    }
    @keyframes floatCloud {
      from { transform: translateX(-200px); }
      to { transform: translateX(3900px); }
    }

    /* 烟囱飘烟效果 */
    .smoke-particle {
      position: absolute; width: 10px; height: 10px; background: rgba(255,255,255,0.7);
      border-radius: 50%; animation: smokeRise 2s infinite ease-out;
    }
    @keyframes smokeRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
      100% { transform: translateY(-40px) scale(2); opacity: 0; }
    }

    /* 远景山峦剪影 */
    .distant-mountains {
      position: absolute; bottom: 45%; left: 0; width: 100%; height: 120px;
      background: repeating-linear-gradient(90deg, #68a8e0 0px, #68a8e0 100px, #5898d0 100px, #5898d0 200px);
      clip-path: polygon(0% 100%, 5% 40%, 12% 80%, 20% 30%, 28% 90%, 35% 20%, 45% 70%, 55% 10%, 65% 80%, 75% 30%, 85% 90%, 92% 20%, 100% 100%);
      opacity: 0.5; pointer-events: none;
    }

    /* 地面与步道 */
    .ground-layer {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 140px;
      background: #805028; border-top: 10px solid var(--grass-dark);
      background-image: radial-gradient(#603818 20%, transparent 20%); background-size: 16px 16px;
      cursor: pointer;
    }
    .cobble-path {
      position: absolute; bottom: 120px; left: 0; width: 100%; height: 20px;
      background: var(--path-color); border-top: 3px solid #b07840; border-bottom: 3px solid #805028;
      background-image: linear-gradient(90deg, #c08848 50%, transparent 50%); background-size: 20px 100%;
    }

    /* ==========================================
       4. HOUSE MODULES (PICONTIER STYLE)
       ========================================== */
    .house-container {
      position: absolute; bottom: 135px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: filter 0.2s, transform 0.2s;
    }
    .house-container:hover {
      filter: drop-shadow(0 0 10px rgba(248, 192, 48, 0.8));
      transform: translateY(-4px);
    }

    /* 挂链标牌 */
    .signboard {
      background: #583018; border: 3px solid #000; color: #f8c030;
      font-family: var(--font-pixel); font-size: 0.6rem; padding: 6px 12px;
      border-radius: 4px; box-shadow: 0 4px 0 #000; margin-bottom: 8px;
      text-align: center; position: relative;
    }
    .signboard::before, .signboard::after {
      content: ""; position: absolute; bottom: -8px; width: 2px; height: 8px; background: #000;
    }
    .signboard::before { left: 12px; } .signboard::after { right: 12px; }

    /* 建筑 SVG 外壳 */
    .building-svg { filter: drop-shadow(4px 6px 0px rgba(0,0,0,0.3)); }

    /* ==========================================
       5. CHARACTER & RPG DIALOG MODAL
       ========================================== */
    #hero-sprite {
      position: absolute; bottom: 135px; left: 150px; width: 56px; height: 72px;
      z-index: 500; pointer-events: none; transform: translateX(-50%);
      transition: bottom 0.1s ease;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 12, 20, 0.82); display: flex; align-items: center; justify-content: center;
      z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    /* JRPG 经典金框对话框 */
    .jrpg-dialog-box {
      background: var(--ui-bg); border: 4px solid #000;
      outline: 4px solid var(--ui-border); border-radius: 6px;
      padding: 28px; max-width: 680px; width: 90%;
      box-shadow: 0 16px 32px rgba(0,0,0,0.9), inset 0 0 0 2px #384058;
      position: relative; max-height: 80vh; overflow-y: auto;
    }

    /* 对话框角饰 */
    .dialog-corner {
      position: absolute; width: 12px; height: 12px; background: var(--ui-border);
      border: 2px solid #000;
    }
    .top-left { top: -6px; left: -6px; } .top-right { top: -6px; right: -6px; }
    .bottom-left { bottom: -6px; left: -6px; } .bottom-right { bottom: -6px; right: -6px; }

    .close-btn {
      position: absolute; top: 14px; right: 14px; background: #d83838;
      color: #fff; border: 2px solid #000; font-family: var(--font-pixel);
      font-size: 0.7rem; padding: 4px 8px; cursor: pointer; box-shadow: 0 3px 0 #000;
    }
    .close-btn:hover { background: #ff4848; }

    .pixel-btn {
      display: inline-flex; align-items: center; gap: 8px; background: #2868c0;
      color: #fff; font-family: var(--font-retro); font-size: 0.85rem; font-weight: bold;
      padding: 10px 16px; border: 2px solid #000; border-radius: 4px;
      cursor: pointer; box-shadow: 0 4px 0 #000; text-decoration: none; margin: 8px 4px 0 0;
    }
    .pixel-btn:hover { background: #3880e0; transform: translateY(-2px); }
  </style>
</head>
<body>

  <!-- ==========================================
       6. AUDIO ENGINE & GAME LOGIC
       ========================================== -->
  <script>
    /* 1. 音效与 Picontier 舒缓治愈长音轨 */
    let audioCtx = null;
    let sfxOn = false;
    let bgmOn = false;
    let bgmTimer = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) audioCtx = new AudioCtxClass();
      }
    }

    function playSfx(type) {
      if (!sfxOn || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime;

      if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(520, t + 0.12);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
      } else if (type === 'open') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.setValueAtTime(640, t + 0.08);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.18);
        osc.start(t); osc.stop(t + 0.18);
      }
    }

    /* Picontier 调性长乐曲 (包含多乐句循环，低倦怠感) */
    const townMelody = [
      {f: 523.25, d: 0.3}, {f: 659.25, d: 0.3}, {f: 783.99, d: 0.3}, {f: 1046.50, d: 0.6},
      {f: 880.00, d: 0.3}, {f: 783.99, d: 0.6}, {f: 659.25, d: 0.6},
      {f: 587.33, d: 0.3}, {f: 659.25, d: 0.3}, {f: 698.46, d: 0.6}, {f: 587.33, d: 0.6},
      {f: 523.25, d: 0.9}, {f: 0, d: 0.3},
      {f: 587.33, d: 0.3}, {f: 698.46, d: 0.3}, {f: 880.00, d: 0.3}, {f: 1046.50, d: 0.6},
      {f: 987.77, d: 0.3}, {f: 880.00, d: 0.6}, {f: 783.99, d: 0.6},
      {f: 659.25, d: 0.4}, {f: 587.33, d: 0.4}, {f: 523.25, d: 0.8}, {f: 0, d: 0.4}
    ];

    let noteIdx = 0;
    function playBGM() {
      if (!bgmOn || !audioCtx) return;
      const note = townMelody[noteIdx];
      if (note.f > 0) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(note.f, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + note.d);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + note.d);
      }
      noteIdx = (noteIdx + 1) % townMelody.length;
      bgmTimer = setTimeout(playBGM, note.d * 1000);
    }

    document.getElementById('bgm-btn').addEventListener('click', () => {
      initAudio();
      bgmOn = !bgmOn;
      document.getElementById('bgm-btn').textContent = bgmOn ? '🎵 BGM: ON' : '🎵 BGM: OFF';
      if (bgmOn) { if (audioCtx.state === 'suspended') audioCtx.resume(); playBGM(); }
      else { clearTimeout(bgmTimer); }
    });

    document.getElementById('sfx-btn').addEventListener('click', () => {
      initAudio();
      sfxOn = !sfxOn;
      document.getElementById('sfx-btn').textContent = sfxOn ? '🔊 SFX: ON' : '🔇 SFX: OFF';
    });

    /* 2. 角色移动与物理引擎 */
    const hero = document.getElementById('hero-sprite');
    let heroX = 150;
    let targetX = 150;
    let heroPosY = 0;
    let velocityY = 0;
    let isJumping = false;
    let facingRight = true;
    let keys = {};

    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    document.getElementById('ground-layer').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      targetX = e.clientX - rect.left;
    });

    function walkToX(x) { targetX = x; }

    function updatePhysics() {
      if (keys['a'] || keys['arrowleft']) { targetX = heroX - 6; facingRight = false; }
      else if (keys['d'] || keys['arrowright']) { targetX = heroX + 6; facingRight = true; }

      if ((keys['w'] || keys[' '] || keys['arrowup']) && !isJumping) {
        isJumping = true; velocityY = 11; playSfx('jump');
      }

      if (isJumping) {
        heroPosY += velocityY; velocityY -= 0.75;
        if (heroPosY <= 0) { heroPosY = 0; isJumping = false; }
      }

      const dx = targetX - heroX;
      if (Math.abs(dx) > 2) {
        facingRight = dx > 0;
        heroX += Math.sign(dx) * Math.min(Math.abs(dx), 5);
      }

      heroX = Math.max(50, Math.min(3720, heroX));

      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${135 + heroPosY}px`;
      hero.style.transform = `translateX(-50%) scaleX(${facingRight ? 1 : -1})`;

      // 镜头跟随
      const scrollLeft = heroX - window.innerWidth / 2;
      window.scrollTo({ left: Math.max(0, scrollLeft), behavior: 'auto' });

      requestAnimationFrame(updatePhysics);
    }
    requestAnimationFrame(updatePhysics);

    function interactWithHouse(key, targetWalkX) {
      walkToX(targetWalkX);
      setTimeout(() => {
        playSfx('open');
        document.getElementById('modal-content').innerHTML = modalData[key];
        document.getElementById('modal-overlay').classList.add('active');
