<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picontier 像素小镇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #111; font-family: 'Press Start 2P', cursive, sans-serif;
      display: flex; justify-content: center; align-items: center;
      image-rendering: pixelated;
    }

    /* 游戏大画布容器 - 保持经典像素比例 */
    #game-container {
      position: relative; width: 1000px; height: 562px;
      background: #78c058; border: 4px solid #1a1a1a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden;
    }

    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

    /* ==========================================
       1. 参考图 1:1 左上角 HUD 状态栏
       ========================================== */
    .hud-top-left {
      position: absolute; top: 12px; left: 16px;
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }

    /* HP / SP 条 */
    .bar-group { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #000; text-shadow: 1px 1px #fff; }
    .bar-bg { width: 140px; height: 14px; background: #283820; border: 2px solid #000; padding: 1px; }
    .bar-fill-hp { width: 100%; height: 100%; background: #40d080; border-bottom: 2px solid #209050; }
    .bar-fill-sp { width: 100%; height: 100%; background: #40d080; border-bottom: 2px solid #209050; }

    /* 时间与日期 */
    .time-box {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; color: #1a1a1a; margin-top: 2px;
    }
    .clock-icon {
      width: 18px; height: 18px; background: #fff; border: 2px solid #000; border-radius: 50%;
      display: inline-block; position: relative;
    }
    .clock-icon::after {
      content: ""; position: absolute; top: 3px; left: 7px; width: 2px; height: 5px; background: #000;
    }

    /* ==========================================
       2. 参考图 1:1 右上角 金币与背包
       ========================================== */
    .hud-top-right {
      position: absolute; top: 12px; right: 16px;
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      z-index: 10; font-size: 12px; color: #000; text-shadow: 1px 1px #fff;
    }

    /* ==========================================
       3. 参考图 1:1 底部 Hotbar 装备栏
       ========================================== */
    .hud-bottom-bar {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      width: 580px; height: 50px;
      background: #c8f0d8; border: 3px solid #184830; border-radius: 6px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3); z-index: 10;
      background-image: repeating-linear-gradient(90deg, #b0e8c8 0px, #b0e8c8 40px, #c8f0d8 40px, #c8f0d8 80px);
    }

    .hotbar-slots { display: flex; gap: 8px; }
    .slot {
      width: 38px; height: 38px; background: #fff; border: 2px solid #184830; border-radius: 4px;
      display: flex; align-items: center; justify-content: center; position: relative; font-size: 18px;
    }
    .slot.active { border: 3px solid #e84030; transform: scale(1.05); }
    .slot-num { position: absolute; bottom: 1px; right: 2px; font-size: 8px; color: #000; font-family: sans-serif; font-weight: bold; }

    /* Control Hint Banner */
    .control-tip {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 6px 12px;
      border-radius: 12px; z-index: 10; pointer-events: none;
    }

    /* 进屋 JRPG 对话框 */
    .modal-dialog {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
      width: 700px; background: #f8f0d8; border: 4px solid #402818; border-radius: 8px;
      padding: 16px; box-shadow: 0 8px 0 #000; z-index: 100; display: none;
      color: #382010; font-family: 'Silkscreen', sans-serif;
    }
    .modal-dialog.active { display: block; }
    .dialog-title { font-size: 14px; color: #d84020; margin-bottom: 8px; font-family: 'Press Start 2P'; }
    .dialog-body { font-size: 12px; line-height: 1.6; color: #201008; }
    .close-btn {
      position: absolute; top: 10px; right: 10px; background: #e84030; color: #fff;
      border: 2px solid #000; font-size: 9px; padding: 4px 8px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="control-tip">🎮 键盘 [W/A/S/D] 或 [方向键] 自由行走探索 | 靠近房屋按 [E] 或点击交互</div>

    <!-- 左上角 HUD -->
    <div class="hud-top-left">
      <div class="bar-group">
        <span>HP 100</span>
        <div class="bar-bg"><div class="bar-fill-hp"></div></div>
      </div>
      <div class="bar-group">
        <span>SP 100</span>
        <div class="bar-bg"><div class="bar-fill-sp"></div></div>
      </div>
      <div class="time-box">
        <span class="clock-icon"></span>
        <span>10:13</span>
        <span style="margin-left: 8px;">📅 6</span>
      </div>
    </div>

    <!-- 右上角 HUD -->
    <div class="hud-top-right">
      <div>🎒 20/32</div>
      <div style="margin-top: 4px;">🪙 8200 G</div>
    </div>

    <!-- 底部 Hotbar -->
    <div class="hud-bottom-bar">
      <span style="font-size: 10px; color: #184830;">L</span>
      <div class="hotbar-slots">
        <div class="slot active">⚔️<span class="slot-num">50</span></div>
        <div class="slot">⛏️<span class="slot-num">50</span></div>
        <div class="slot">🪓<span class="slot-num">14</span></div>
        <div class="slot">✂️<span class="slot-num">40</span></div>
        <div class="slot">🎣</div>
      </div>
      <span style="font-size: 10px; color: #184830;">R</span>
    </div>

    <!-- 交互弹窗 -->
    <div class="modal-dialog" id="modal-dialog">
      <button class="close-btn" onclick="closeDialog()">[X] CLOSE</button>
      <div class="dialog-title" id="dialog-title">房屋名称</div>
      <div class="dialog-body" id="dialog-body">详情内容...</div>
    </div>

    <canvas id="gameCanvas" width="1000" height="562"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    /* 1. 地图与角色状态 (完全对标参考图布局) */
    const player = {
      x: 500, y: 280,
      speed: 3, width: 24, height: 32,
      facing: 'down'
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    /* 房子建筑数据 */
    const houses = [
      {
        id: 'shop', name: '🏬 道具小铺 (WORLD 1-1)',
        x: 120, y: 140, w: 220, h: 160,
        doorX: 230, doorY: 280,
        color: '#d84030', wallColor: '#f8f0d8',
        info: '<b>【关于我 / HOME】</b><br>欢迎光临 Picontier 视效工坊！这里展示全套 16-Bit 像素与 UI 视觉设计。'
      },
      {
        id: 'home', name: '🏡 楚楚的农场小屋 (WORLD 1-2)',
        x: 720, y: 140, w: 200, h: 160,
        doorX: 780, doorY: 280,
        color: '#e85830', wallColor: '#e0dac8',
        info: '<b>【个人档案与技能库】</b><br>熟练掌握 AIGC 图形生成、游戏 UI 界面设计、16-Bit 像素资产打造及电商视觉展示。'
      }
    ];

    /* 2. 渲染 Picontier 风格的 2.5D 像素地图 */
    function drawMap() {
      // 1. 草地背景 (#78c058)
      ctx.fillStyle = '#78c058';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 绘制草地上的小白花/小黄花点缀
      ctx.fillStyle = '#ffffff';
      for(let i=0; i<canvas.width; i+=80) {
        for(let j=0; j<canvas.height; j+=70) {
          if ((i+j)%3 === 0) {
            ctx.fillRect(i + 10, j + 15, 3, 3);
            ctx.fillRect(i + 13, j + 18, 3, 3);
          }
        }
      }

      // 2. 中央淡黄石板大道 (参考图中间的大路)
      ctx.fillStyle = '#f0e8b8';
      ctx.fillRect(410, 0, 180, canvas.height);
      ctx.strokeStyle = '#d8cc90';
      ctx.strokeRect(410, 0, 180, canvas.height);

      // 中央路面砖石花纹 (参考图地砖花纹)
      ctx.strokeStyle = '#e0d4a0';
      ctx.lineWidth = 2;
      for (let y = 40; y < canvas.height; y += 120) {
        ctx.strokeRect(470, y, 60, 60);
        ctx.strokeRect(485, y + 15, 30, 30);
      }

      // 3. 左侧篱笆院子与地面
      ctx.fillStyle = '#b0e098';
      ctx.fillRect(60, 180, 310, 240);
      
      // 白色木栅栏 (完全参考图紫色/白边栅栏结构)
      ctx.fillStyle = '#eae6f0';
      ctx.strokeStyle = '#403050';
      ctx.lineWidth = 2;
      // 栅栏线条
      ctx.fillRect(60, 180, 310, 12); ctx.strokeRect(60, 180, 310, 12);
      ctx.fillRect(360, 180, 12, 240); ctx.strokeRect(360, 180, 12, 240);
      ctx.fillRect(60, 410, 310, 12); ctx.strokeRect(60, 410, 310, 12);

      // 4. 道路两侧的圆滚滚像素小树排布
      const treePositions = [
        [380, 50], [380, 160], [380, 270], [380, 380], [380, 490],
        [600, 50], [600, 160], [600, 270], [600, 380], [600, 490]
      ];
      treePositions.forEach(([tx, ty]) => drawPixelTree(tx, ty));

      // 5. 绘制房屋
      houses.forEach(h => drawHouse(h));

      // 6. 装饰物（木桶、木箱、水壶）
      drawDecoBarrel(320, 260);
      drawDecoBarrel(340, 260);
      drawDecoPot(680, 220);
      drawDecoPot(680, 250);
    }

    /* 绘制 Picontier 圆形树木 */
    function drawPixelTree(x, y) {
      // 树干
      ctx.fillStyle = '#683818';
      ctx.fillRect(x + 12, y + 28, 8, 16);
      // 树冠 (椭圆像素层)
      ctx.fillStyle = '#288828';
      ctx.beginPath(); ctx.arc(x + 16, y + 18, 18, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#185018'; ctx.lineWidth = 2; ctx.stroke();
      // 高光层
      ctx.fillStyle = '#58b848';
      ctx.beginPath(); ctx.arc(x + 12, y + 12, 8, 0, Math.PI * 2); ctx.fill();
    }

    /* 绘制参考图 1:1 的 Picontier 小屋 */
    function drawHouse(h) {
      // 墙体
      ctx.fillStyle = h.wallColor;
      ctx.fillRect(h.x, h.y + 50, h.w, h.h - 50);
      ctx.strokeStyle = '#201008'; ctx.lineWidth = 3;
      ctx.strokeRect(h.x, h.y + 50, h.w, h.h - 50);

      // 屋顶 (红色双重屋檐)
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.moveTo(h.x - 10, h.y + 55);
      ctx.lineTo(h.x + h.w / 2, h.y);
      ctx.lineTo(h.x + h.w + 10, h.y + 55);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // 屋檐阴影
      ctx.fillStyle = '#a02818';
      ctx.fillRect(h.x - 5, h.y + 48, h.w + 10, 10);

      // 门
      ctx.fillStyle = '#502810';
      ctx.fillRect(h.doorX - 15, h.y + 90, 32, 50);
      ctx.strokeRect(h.doorX - 15, h.y + 90, 32, 50);

      // 窗户
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(h.x + h.w - 50, h.y + 70, 30, 25);
      ctx.strokeRect(h.x + h.w - 50, h.y + 70, 30, 25);

      // 招牌
      ctx.fillStyle = '#d89040';
      ctx.fillRect(h.x + 30, h.y + 35, 50, 18);
      ctx.strokeRect(h.x + 30, h.y + 35, 50, 18);
    }

    function drawDecoBarrel(x, y) {
      ctx.fillStyle = '#a06020'; ctx.fillRect(x, y, 18, 22);
      ctx.strokeStyle = '#000'; ctx.strokeRect(x, y, 18, 22);
      ctx.fillStyle = '#000'; ctx.fillRect(x, y + 6, 18, 2); ctx.fillRect(x, y + 14, 18, 2);
    }

    function drawDecoPot(x, y) {
      ctx.fillStyle = '#884018';
      ctx.beginPath(); ctx.arc(x + 10, y + 10, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    /* 3. 绘制玩家角色 (Picontier 棕发主角) */
    function drawPlayer() {
      const { x, y } = player;

      // 身体/衣服
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 8, y - 12, 16, 12);
      ctx.fillStyle = '#3868c0'; // 蓝裤子
      ctx.fillRect(x - 8, y, 16, 10);

      // 头部
      ctx.fillStyle = '#ffcca0'; // 皮肤
      ctx.fillRect(x - 10, y - 26, 20, 15);

      // 棕色头发 (参考图主角发型)
      ctx.fillStyle = '#804018';
      ctx.fillRect(x - 12, y - 32, 24, 10);
      ctx.fillRect(x - 12, y - 26, 4, 10);
      ctx.fillRect(x + 8, y - 26, 4, 10);

      // 眼睛
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 5, y - 20, 3, 4);
      ctx.fillRect(x + 2, y - 20, 3, 4);
    }

    /* 4. 逻辑更新与房屋碰撞/交互 */
    function update() {
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= player.speed;
      if (keys['s'] || keys['arrowdown']) dy += player.speed;
      if (keys['a'] || keys['arrowleft']) dx -= player.speed;
      if (keys['d'] || keys['arrowright']) dx += player.speed;

      player.x = Math.max(30, Math.min(canvas.width - 30, player.x + dx));
      player.y = Math.max(50, Math.min(canvas.height - 30, player.y + dy));

      // 检查靠近房屋
      houses.forEach(h => {
        const dist = Math.hypot(player.x - h.doorX, player.y - (h.y + 110));
        if (dist < 40) {
          openDialog(h.name, h.info);
        }
      });
    }

    function openDialog(title, content) {
      document.getElementById('dialog-title').innerHTML = title;
      document.getElementById('dialog-body').innerHTML = content;
      document.getElementById('modal-dialog').classList.add('active');
    }

    function closeDialog() {
      document.getElementById('modal-dialog').classList.remove('active');
    }

    /* 5. 游戏主循环 */
    function loop() {
      update();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMap();
      drawPlayer();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
